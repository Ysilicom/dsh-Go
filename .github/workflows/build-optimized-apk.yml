name: Build Optimized APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Arm64 Optimized APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          echo "Flutter version:"
          flutter --version
          echo "Java version:"
          java -version

      - name: Configure Custom Keystore (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Custom keystore secret detected. Setting up release signing..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/release.jks
            cp app/android/app/release.jks app/android/release.jks
            cat <<EOF > app/android/key.properties
            storeFile=release.jks
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOF
            echo "Custom key.properties created successfully."
          else
            echo "No custom keystore secret provided. Falling back to default debug key signing."
          fi

      - name: Prepare Prebuilt Runtime Assets
        run: |
          chmod +x tooling/fetch-runtime.sh tooling/build-apk.sh
          ./tooling/fetch-runtime.sh

      - name: Install Flutter Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Optimized Release APK
        run: |
          ./tooling/build-apk.sh -f arm64 --release --build-name 1.0.7

      - name: Collect Output APK
        id: collect
        run: |
          APK_PATH=$(find app/build/app/outputs/flutter-apk -name "*.apk" -not -name "*sha*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" dsh-go-1.0.7-arm64-optimized.apk
          sha256sum dsh-go-1.0.7-arm64-optimized.apk > dsh-go-1.0.7-arm64-optimized.apk.sha256
          cat dsh-go-1.0.7-arm64-optimized.apk.sha256

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-1.0.7-arm64-optimized
          path: |
            dsh-go-1.0.7-arm64-optimized.apk
            dsh-go-1.0.7-arm64-optimized.apk.sha256
          retention-days: 14

      - name: Publish Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-go-1.0.7-arm64-optimized.apk
            dsh-go-1.0.7-arm64-optimized.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
